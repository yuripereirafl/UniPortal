version: '3.8'

# =============================================================================
# CONFIGURAÇÃO SIMPLIFICADA - SEM BANCO LOCAL
# =============================================================================
# Este Docker Compose APENAS executa a aplicação.
# O banco de dados é EXTERNO (já configurado no servidor).

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Configurações do banco EXTERNO (não local)
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - uniportal-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    environment:
      # URL da API configurada automaticamente
      - VUE_APP_ENVIRONMENT=${ENVIRONMENT:-production}
      - VUE_APP_API_URL=http://${DB_HOST:-192.168.1.37}:${BACKEND_PORT:-8000}
    depends_on:
      - backend
    networks:
      - uniportal-network
    restart: unless-stopped

networks:
  uniportal-network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-uniportal}_network
