version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks:
      - UniPortal-main-fresh

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    environment:
      # Forçar URL da API apontando para a VM pública/privada onde o backend estará
      - VUE_APP_API_URL=http://192.168.1.37:8000
    depends_on:
      - backend
    networks:
      - UniPortal-main-fresh

networks:
  UniPortal-main-fresh:
    driver: bridge
